[project]
name = "dubizzle-assistant"
version = "0.1.0"
description = "Conversational assistant over a used-car inventory: FastAPI backend, Streamlit client, Gemini via LiteLLM."
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Samad Zeeshan" }]
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52",
  "pydantic>=2",
  "pydantic-settings>=2.15",
  "litellm==1.99.0",
  "streamlit==1.63.0",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "tzdata",
  "dateparser>=1.2",
  "numpy>=2",
]

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubizzle_assistant"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: needs GEMINI_API_KEY and network"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
